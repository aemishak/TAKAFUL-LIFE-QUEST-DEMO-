const hideDie=()=>tween(.25,k=>dice.scale.setScalar(1.6*(1-k)));
function bigNum(x){const e=$("big");e.textContent=x;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
function stepBanner(n){const e=$('steps');if(n>0){e.textContent='👣 '+n+' '+(lang==='bm'?'langkah':'steps');e.classList.add('on')}else e.classList.remove('on')}
async function roll(){
  if(G.st!=='READY')return;audioInit();const p=G.pl[G.cur],d=1+Math.floor(Math.random()*6);G.last=d;p.rolls=(p.rolls||0)+1;setSt('ROLLING');resetCam();
  setPrompt(()=>t('rolling'));await rollDice(d);
  $('dv').textContent=d;bigNum(d);setPrompt(()=>d===6?t('six'):t('res',nm(p),d));log(()=>t('lgRoll',nm(p),d));
  await wait(.9);await hideDie();setSt('MOVING');
  await walk(p,d);if(p.tile===100)return win(p);
  await resolve(p);
  if(d===6&&!p.skip){log(()=>t('lgSix',nm(p)),'b')}else{await nextPlayer();focus(G.pl[G.cur].tile,8,10)}
  renderPl();setPrompt(()=>t('ready'));setSt('READY');saveG();
}
async function walk(p,d){let dir=1;for(let i=0;i<d;i++){stepBanner(d-i);if(p.tile===100&&dir===1){dir=-1;toast(()=>t('bounce'))}p.tile+=dir;renderPl();focus(p.tile,8,10);await hop(p,p.tile)}stepBanner(0)}
function showEvent(n){return new Promise(res=>{G.evN=n;renderEv();$('ev').classList.add('show');G.pending=()=>{$('ev').classList.remove('show');G.evN=0;res()}})}
async function resolve(p){
  const n=p.tile;if(n===1||!EV[n])return;
  const ty=EV[n].ty,pos=ty==='ladder'||ty==='bonus';p.st=p.st||{};p.st[ty]=(p.st[ty]||0)+1;
  setSt('EVENT');focus(n,7,10);flash(pos?'pos':'neg');tileFx(n);screenFx(ty);
  log(()=>`${ICON[n]} <strong>${nm(p)}</strong>: ${EV[n][lang]} (<strong>${eff(n)}</strong>)`,ty==='ladder'?'l':ty==='snake'?'s':ty==='bonus'?'b':'p');
  if(G.voice){stopSay();say(`${EV[n][lang]}. ${eff(n)}`)}
  await showEvent(n);stopSay();setSt('MOVING');
  if(LAD[n]){snd('ladder');focus(LAD[n],8,11);VA.copy(p.m.position);const top=ladTop[n];await tween(1.1,k=>{p.m.position.lerpVectors(VA,top,k)},eio);p.tile=LAD[n];renderPl();await hop(p,p.tile,.3)}
  else if(SNK[n]){snd('snake');focus(SNK[n],8,11);const cu=snkCur[n];await tween(1.3,k=>{cu.getPointAt(k,p.m.position)},eio);p.tile=SNK[n];renderPl();await hop(p,p.tile,.3)}
  else if(SPC[n]){const[k,v]=SPC[n];
    if(k==='fwd'){snd('bonus');for(let i=0;i<v;i++){p.tile++;renderPl();await hop(p,p.tile)}}
    else if(k==='back'){snd('pen');p.tile-=v;renderPl();await hop(p,p.tile)}
    else{snd('pen');p.skip=1;renderPl()}}
  resetCam();
}
async function nextPlayer(){
  do{G.cur=(G.cur+1)%G.pl.length;if(G.cur===0)G.turn++;const q=G.pl[G.cur];
    if(q.skip>0){q.skip--;renderPl();log(()=>t('lgSkip',nm(q)),'p');toast(()=>t('lgSkip',nm(q)));await wait(1.5);continue}break}while(true);
}
function sumHTML(){const L=lang==='bm'?['Baling','Tangga','Ular','Bonus','Penalti']:['Rolls','Ladders','Risks','Bonus','Penalty'];
  const rows=[...G.pl].sort((a,b)=>b.tile-a.tile).map(p=>{const q=p.st||{};return `<tr><td>${nm(p)}</td><td>${p.rolls||0}</td><td>${q.ladder||0}</td><td>${q.snake||0}</td><td>${q.bonus||0}</td><td>${q.penalty||0}</td></tr>`}).join('');
  const w=G.pl[G.cur],q=w.st||{},tip=(q.snake||0)>(q.ladder||0)?(lang==='bm'?'Anda banyak berdepan risiko. Perlindungan awal boleh kurangkan kesannya.':'You faced many risks. Early protection softens their impact.'):(lang==='bm'?'Anda banyak memanfaatkan perlindungan. Teruskan merancang awal!':'You made the most of protection. Keep planning early!');
  return `<table class="sm"><tr><th></th>${L.map(x=>`<th>${x}</th>`).join('')}</tr>${rows}</table><p class="tip">💡 ${tip}</p>`}
function win(p){try{localStorage.removeItem('tlq-save')}catch(e){}setSt('FINISHED');snd('win');flash('pos');focus(100,7,10);renderPl();log(()=>t('lgWin',nm(p)),'l');$('wn').textContent=t('win',nm(p));$('sum').innerHTML=sumHTML();$('win').classList.add('show');if(G.voice){stopSay();say(`${t('win',nm(p))} ${t('winMsg')}`)}
  if(!RM)for(let i=0;i<80;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:${['#ffd166','#00e5ff','#f43f5e','#10b981','#fff','#a855f7'][i%6]};animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*1.2}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),7500)}}
function saveG(){try{localStorage.setItem('tlq-save',JSON.stringify({n:G.n,names:G.names,cur:G.cur,turn:G.turn,pl:G.pl.map(p=>({tile:p.tile,skip:p.skip,st:p.st,rolls:p.rolls}))}))}catch(e){}}
function loadG(){try{return JSON.parse(localStorage.getItem('tlq-save'))}catch(e){return null}}
function resumeG(sv){G.n=sv.n;G.names=sv.names;initGame();sv.pl.forEach((o,i)=>{const p=G.pl[i];p.tile=o.tile;p.skip=o.skip;p.st=o.st;p.rolls=o.rolls;gnd(p,p.tile,p.m.position)});G.cur=sv.cur;G.turn=sv.turn;renderPl();focus(G.pl[G.cur].tile,8,10)}
function initGame(){
  stopSay();G.ep++;TW.length=0;G.pending=null;G.evN=0;$('ev').classList.remove('show');$('win').classList.remove('show');$('setup').classList.remove('show');
  tokens.forEach(m=>m.visible=false);dice.scale.setScalar(0);FX.pts.visible=false;FX.rg.visible=false;
  G.pl=Array.from({length:G.n},(_,i)=>({i,tile:1,skip:0,m:tokens[i]}));
  G.pl.forEach(p=>{p.m.visible=true;gnd(p,1,p.m.position)});
  G.cur=0;G.turn=1;G.logs=[];$('dv').textContent='🎲';log(()=>t('lgStart'));renderPl();setPrompt(()=>t('ready'));setSt('READY');resetCam();
}
/* ===== wiring ===== */
$('roll').onclick=roll;
$('adv').onclick=()=>{const f=G.pending;G.pending=null;if(f)f()};
$('bLang').onclick=()=>{stopSay();lang=lang==='en'?'bm':'en';try{localStorage.setItem('tlq-lang',lang)}catch(e){}applyLang()};
$('bPl').onclick=()=>{$('scancel').style.display=G.pl.length?'inline-block':'none';$('setup').classList.add('show')};
$('scancel').onclick=()=>$('setup').classList.remove('show');
$('go').onclick=()=>{audioInit();initGame()};
$('bGfx').onclick=()=>{const o=['auto','perf','quality'];setMode(o[(o.indexOf(mode)+1)%3])};
$('bSnd').onclick=()=>{G.mute=!G.mute;audioInit();sndLbl()};
function openRules(){$('rules').classList.add('show');DM.on=true;demoSize();startDemoLoop()}
function closeRules(){stopSay();DM.on=false;$('rules').classList.remove('show')}
$('bRules').onclick=openRules;$('rclose').onclick=closeRules;
$('rListen').onclick=()=>{audioInit();sayRules()};$('rStop').onclick=stopSay;$('sListen').onclick=()=>{audioInit();openRules();sayRules()};
$('rl').onclick=e=>{const p=e.target.closest('p[data-r]');if(p){audioInit();ruleOne(+p.dataset.r)}};
DM.c=$('demo');DM.g=DM.c.getContext('2d');$('dDots').innerHTML='<i></i>'.repeat(7);setScene(0);addEventListener('resize',()=>{if(DM.on)demoSize()});window.__TLQ.demo={DM,setScene,playDemo,renderDemo,demoSize};
$('bVo').onclick=()=>{G.voice=!G.voice;if(!G.voice)stopSay();voLbl()};
if(!SS)['bVo'].forEach(i=>$(i).style.display='none');
$('bCam').onclick=()=>{view^=1;resetCam()};$('bIco').onclick=()=>{G.showAll=!G.showAll;icoLbl()};$('bRs').onclick=()=>{if(G.pl.length)initGame()};
$('again').onclick=()=>{$('win').classList.remove('show');$('scancel').style.display='none';$('setup').classList.add('show')};
addEventListener('keydown',e=>{if(e.code!=='Space'||document.activeElement.tagName==='INPUT')return;e.preventDefault();if(G.pending){e.preventDefault();$('adv').click()}else if(G.st==='READY'&&G.pl.length&&!$('setup').classList.contains('show')){e.preventDefault();roll()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.id!=='go')b.blur()});
$('bTh').onclick=()=>{THM=THM==='dark'?'light':'dark';applyTheme(true)};applyTheme(false);
$('play').onclick=()=>{audioInit();startMusic();$('intro').classList.add('hide')};
{const sv=loadG();if(sv&&sv.pl&&sv.pl.some(p=>p.tile>1)){const b=$('resume');b.style.display='block';b.textContent=lang==='bm'?'▶ Sambung permainan':'▶ Resume game';b.onclick=()=>{audioInit();startMusic();$('intro').classList.add('hide');resumeG(sv)}}}
setCount(2);applyLang();
if(boot()){applyTheme(false);loop()}
})();
</script>
